<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden | accnet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0d0f12;
            --border: #232730;
            --text-main: #f3f4f6;
            --text-muted: #8b929e;
            --topbar-height: 60px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            box-shadow: none !important;
            text-shadow: none !important;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-content {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            padding: 24px;
        }

        .error-code {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-main, currentColor);
        }

        .error-label {
            margin-top: 8px;
            font-size: 15px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted, #888);
        }
    </style>
</head>
<body>
    <main class="error-content">
        <div class="error-code">403</div>
        <div class="error-label">Forbidden</div>
    </main>
</body>
</html>
